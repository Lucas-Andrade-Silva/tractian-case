[project]
name = "tractian-evaluation"
version = "0.1.0"
description = "Avaliação do agente contra cenários e gabarito (minha implementação — Parte 2 do desafio)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
