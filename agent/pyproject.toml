[project]
name = "tractian-agent"
version = "0.1.0"
description = "Agente de suporte industrial (minha implementação — Parte 1 do desafio)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "langgraph>=0.2.30",
    "langchain-core>=0.3",
]

[project.optional-dependencies]
# Provedor de LLM — escolhido por último (ver agent/app/llm.py).
# Instale só o que for usar: uv pip install -e ".[groq]"
groq = ["langchain-groq>=0.2"]
openai = ["langchain-openai>=0.2"]
# Modo servidor (`python server.py --serve`): a aba Consulta do painel.
serve = ["fastapi>=0.110", "uvicorn>=0.27", "pandas>=2.0", "pyarrow>=15"]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `llm` marca testes que gastam cota de LLM real; ficam fora da suíte padrão.
markers = ["llm: exige rede e cota de LLM (rode com -m llm)"]
addopts = "-m 'not llm'"
